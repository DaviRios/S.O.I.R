services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: soir
      POSTGRES_USER: soir
      POSTGRES_PASSWORD: soir
    ports:
      - '5432:5432'
    volumes:
      - soir-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U soir -d soir']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  soir-postgres:
